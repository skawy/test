<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PE & BS Dashboard Assistant</title>
<style>
  :root {
    --blue: #3662a8;
    --blue-dark: #2b4f8a;
    --teal: #438a96;
    --green: #6ccc84;
    --bg: #f4f4f4;
    --line: #dcdfe4;
    --text: #1f2a3a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", -apple-system, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
  }

  /* Teal-to-green strip, like the dashboard sidebar */
  .strip {
    width: 10px;
    flex-shrink: 0;
    background: linear-gradient(to bottom, var(--teal), var(--green));
  }

  .app { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  header {
    background: var(--blue);
    color: #fff;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  #clear {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,.6);
    border-radius: 4px;
    padding: 5px 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  #clear:hover { background: rgba(255,255,255,.15); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .empty {
    margin: auto;
    color: #7a8494;
    font-size: 14px;
    text-align: center;
  }
  .msg {
    max-width: 78%;
    padding: 9px 13px;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.45;
    font-size: 14px;
  }
  .user {
    align-self: flex-end;
    background: var(--blue);
    color: #fff;
    border-bottom-right-radius: 2px;
  }
  .assistant {
    align-self: flex-start;
    background: #fff;
    border: 1px solid var(--line);
    border-left: 3px solid var(--green);
    border-bottom-left-radius: 2px;
  }
  .error {
    align-self: flex-start;
    background: #fff4f4;
    border: 1px solid #f0b4b4;
    color: #a12a2a;
  }
  .typing { color: #7a8494; font-style: italic; }

  form {
    display: flex;
    gap: 8px;
    padding: 12px 18px;
    background: #fff;
    border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1;
    resize: none;
    height: 44px;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    outline: none;
  }
  textarea:focus { border-color: var(--blue); }
  #send {
    padding: 0 22px;
    background: var(--blue);
    color: #fff;
    border: 0;
    border-radius: 6px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #send:hover { background: var(--blue-dark); }
  #send:disabled { opacity: .5; cursor: wait; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
</style>
</head>
<body>
<div class="strip"></div>

<div class="app">
  <header>
    <h1>Dashboard Assistant</h1>
    <button id="clear" type="button">Clear chat</button>
  </header>

  <div id="chat"><div class="empty">Ask anything about the dashboard.</div></div>

  <form id="form">
    <textarea id="input" placeholder="Type a message…"></textarea>
    <button id="send">Send</button>
  </form>
</div>

<script>
  // Change this to your backend URL
//   const BACKEND_URL = "http://127.0.0.1:8000";
  const BACKEND_URL = "https://ca-weu-ask-dashboard.bluecliff-8a2afeab.westeurope.azurecontainerapps.io";
  const MAX_HISTORY = 20;

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let history = [];

  function bubble(cls, text) {
    chat.querySelector(".empty")?.remove();
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function sendMessage(text) {
    bubble("user", text);
    const payload = { message: text, history: history.slice(-MAX_HISTORY) };
    history.push({ role: "user", content: text });

    const reply = bubble("assistant typing", "Typing…");
    send.disabled = true;

    try {
      const res = await fetch(BACKEND_URL.replace(/\/+$/, "") + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error("Server error " + res.status);

      const data = await res.json();
      const answer = data.reply?.trim() || "(empty reply)";
      reply.className = "msg assistant";
      reply.textContent = answer;
      history.push({ role: "assistant", content: answer });
    } catch (err) {
      reply.className = "msg error";
      reply.textContent = "Couldn't reach the assistant. Check that the backend is running.";
      history.pop();
    } finally {
      send.disabled = false;
      input.focus();
      chat.scrollTop = chat.scrollHeight;
    }
  }

  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = "";
    sendMessage(text);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      document.getElementById("form").requestSubmit();
    }
  });

  document.getElementById("clear").addEventListener("click", () => {
    history = [];
    chat.innerHTML = '<div class="empty">You Can Ask anything about the dashboard.</div>';
    input.focus();
  });

  input.focus();
</script>
</body>
</html>
